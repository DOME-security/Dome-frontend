# OpenSSF Scorecard: supply-chain checks on the default branch.
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to upload results to GitHub code scanning.
      security-events: write
      # Needed to publish results to the public Scorecard API and badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: results.sarif
