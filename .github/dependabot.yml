# Keeps pinned action SHAs and npm dependencies current. Updates arrive as
# PRs and go through the same CI and review as any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint']
      test:
        patterns: ['vitest', '@testing-library/*', 'jsdom', '@playwright/test']
